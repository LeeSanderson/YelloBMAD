<!DOCTYPE html>
<!--
    `lang` is the pre-boot default and is REPLACED at startup from the active culture -
    Yello.Client/Program.cs sets it through `document.documentElement.setAttribute`, and
    `The_document_language_is_set_from_the_active_culture` in the architecture suite fails the
    build if that call disappears.

    It matters more than it looks. `base.css:141-172` is the most elaborate thing in the base
    layer: three rules that withhold `text-transform: uppercase` from Turkish, Azeri and Greek
    because uppercasing is lossy there, and withhold letter-spacing from 24 case-less scripts
    because it severs connected joins. All of it keys on `:lang()`, which resolves against this
    attribute - so while it was hard-coded, the entire exclusion list was inert and Turkish
    content would have been uppercased lossily. `deferred-work.md:32` recorded that and named the
    first story to introduce localisation resources and a culture provider as its owner. Story
    1.3 is that story.

    The attribute cannot simply be removed: this file is served before the WebAssembly runtime
    exists, so something has to be here for the pre-boot page, and a document with no `lang` at
    all is a WCAG 3.1.1 failure in its own right.
-->
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yello</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />

    <!--
        The design foundations, in dependency order: tokens.css declares every colour, size,
        space, radius and duration; base.css applies the parts that must hold for every surface;
        components.css draws the components themselves. Fingerprinted through the same
        `#[.{fingerprint}]` placeholder the framework script uses below, which
        OverrideHtmlAssetPlaceholders (Yello.Client.csproj:4) rewrites at build.

        Superseded 2026-08-29 by story 1.3, which added the third sheet. This previously listed
        two files and described `base.css` as the last of them.

        There is still no scoped-CSS bundle link and no `Yello.Client.styles.css`: story 1.3's
        components are shared rather than one page's private styling, so they live in a global
        sheet. Adding a `.razor.css` anywhere would produce the bundle and need its own link
        restored - `Every_stylesheet_is_linked_by_the_host_page` fails the build until it is.

        Every sheet under wwwroot/css is required to be linked here, derived from the corpus
        rather than from a list - so a fourth sheet is held to this without anyone extending a
        gate.
    -->
    <link rel="stylesheet" href="css/tokens#[.{fingerprint}].css" />
    <link rel="stylesheet" href="css/base#[.{fingerprint}].css" />
    <link rel="stylesheet" href="css/components#[.{fingerprint}].css" />

    <script type="importmap"></script>
</head>

<body>
    <!--
        Superseded 2026-08-27 by story 1.2, which shipped the design foundations this comment
        was waiting on. It previously read "Deliberately unstyled ... this story ships no
        stylesheet link, no :root block and no hex value", which describes story 1.1's tree and
        became false the moment css/tokens.css landed. Recorded as a correction rather than
        deleted, because stale hand-off prose in exactly these three files produced six of story
        1.1's review findings.

        The two stylesheets are linked in the head above. The Blazor template's Bootstrap bundle
        and css/app.css remain removed - Yello inherits no UI system, so every token carries a
        literal value rather than a delta.

        The "Loading Yello" text below is the framework's pre-boot placeholder: it is emitted by
        this static file before the WebAssembly runtime exists, so it cannot come from a Blazor
        resource. A declared variance from the externalised-copy rule, recorded rather than
        exempted silently. The same applies to the error banner's English strings below.
    -->
    <div id="app">Loading Yello&hellip;</div>

    <!--
        The element blazor.webassembly.js unhides when an unhandled exception reaches it or a
        reconnection fails. Its ID and the `reload`/`dismiss` classes are contractual - the
        framework looks for exactly these - so the element has to exist even though this story
        writes no CSS.

        It was removed with the rest of the template's styled banner, which left every
        unhandled client error console-only: the page would sit on "Loading Yello..." or hold a
        stale render with nothing shown to the user. That is a silent failure mode by
        construction, and this story has no other error surface to fall back on.

        Story 1.1 restored it WITHOUT styling and recorded that story 1.2 owns making it look
        like anything. Story 1.2 has: see the `#blazor-error-ui` rules in css/base.css, drawn
        entirely from the tokens.

        `display:none` stays inline. It is the framework's own precondition for unhiding the
        element rather than a design decision, so it does not move into the stylesheet.

        The dismiss control is a native `<button type="button">`. As a bare `<span>` it was an
        affordance no keyboard user could operate and on which the focus ring could never render.
        Code review 2026-08-27 added `role="button"` and `tabindex="0"`, which made it worse: the
        framework's shipped `blazor.webassembly.js` binds `.dismiss` with `onclick` only and no key
        handler, and a `<span role="button">` does not synthesise a click from Enter or Space - so
        it was announced as a button that no key could activate. Corrected 2026-08-28 to a real
        button, which needs no JavaScript to be operable and takes an accessible name that `&times;`
        alone could never provide.

        The class name stays exactly `dismiss` - that is the framework's contract - and its
        selector is element-agnostic, so changing the element does not break it.

        `aria-label` is English here for the same reason the banner's text is: this file is served
        before the WebAssembly runtime exists, so no Blazor resource can reach it. A declared
        variance, recorded with the others above rather than exempted silently.
    -->
    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss this error">&times;</button>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
