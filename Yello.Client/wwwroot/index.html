<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yello</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script type="importmap"></script>
</head>

<body>
    <!--
        Deliberately unstyled. Story 1.2 owns every design foundation - colour tokens, the
        type scale, the spacing scale, the focus ring and the contrast harness - and gates
        the token count at exactly 30 so an incomplete token set is detectable rather than
        merely wrong. A partial token set written here is precisely the failure that AC
        exists to catch, so this story ships no stylesheet link, no :root block and no hex
        value. The Blazor template's Bootstrap bundle, css/app.css, scoped-CSS bundle and
        styled error banner were removed for the same reason; story 1.2 reintroduces an
        error surface built from the tokens.
    -->
    <div id="app">Loading Yello&hellip;</div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
