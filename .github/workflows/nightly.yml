# Yello's Nightly stage (story 2.9, AC15; test-design-qa.md:402-435; deferred-work.md:419): the Board at the NFR-8
# scale, too slow for the PR stage.
#
#   nightly        the Tier=Nightly tests: the paged Board's p95 at 5,000 Tasks (P-2), the keyboard step's cost at
#                  5,000 loaded cards (AC14) and the real-Host traversal of 5,000 Tasks by the arrows (X-5).
#
# Local Testcontainers engines only - never Azure, no login, no secret, no deployment target (R13). One test module at a
# time, so one 2 GB SQL Server is alive at once. Each step names the project that holds the tier's tests: a filtered run
# of a project with none of them would select zero tests and exit 8 (TESTING-CONVENTIONS.md). The tests are Explicit, so
# the PR stage and a plain local run never start them; `--explicit on` lets the tier filter select them.
#
# Every third-party action is pinned to a full commit SHA, with its version in a trailing comment.

name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YELLO_REQUIRE_CONTAINER_RUNTIME: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Test code runs in this job; the token is not left in .git/config for it to read.
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Yello.slnx
          dotnet tool restore

      # Release for the Host and the wire suites; the browser suite's dev server serves the Debug client, so the client is
      # built in Debug too.
      - name: Build
        run: |
          dotnet build Yello.slnx -c Release --no-restore
          dotnet build Yello.Client/Yello.Client.csproj -c Debug --no-restore

      - name: Development certificate
        run: dotnet dev-certs https

      - name: Browser for the Client suite
        run: pwsh tests/Yello.Tests.Client/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: Nightly - the Board at 5,000 over the wire
        run: >-
          dotnet test --project tests/Yello.Tests.Slices/Yello.Tests.Slices.csproj -c Release --no-build
          --max-parallel-test-modules 1 --
          --filter-trait "Tier=Nightly" --explicit on
          --report-xunit-trx --results-directory "$GITHUB_WORKSPACE/TestResults/slices"

      - name: Nightly - the Board at 5,000 in the browser
        run: >-
          dotnet test --project tests/Yello.Tests.Client/Yello.Tests.Client.csproj -c Release --no-build
          --max-parallel-test-modules 1 --
          --filter-trait "Tier=Nightly" --explicit on
          --report-xunit-trx --results-directory "$GITHUB_WORKSPACE/TestResults/client"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-results
          path: TestResults
          if-no-files-found: warn
