# Yello's Weekly stage (story 2.9, AC15, AC16, AC8; test-design-qa.md:402-435; deferred-work.md:419): the load at the
# NFR-8 envelope and the cold path, too long for the PR or the Nightly stage.
#
#   weekly         the Tier=Weekly tests: the envelope load's p95 per operation class against NFR-5 (P-1), and the
#                  cold-start characterisation, which records and asserts nothing about time (P-11, AR-40b).
#
# A local Testcontainers engine only - never Azure, no login, no secret, no deployment target (R13): the figures are a
# local engine's, warm, and never production evidence (R18). One test module at a time. The tests are Explicit, so the
# PR stage and a plain local run never start them; `--explicit on` lets the tier filter select them. Only the Slices
# suite holds Weekly tests, so it is the only project run (a filter that selects nothing exits 8).
#
# Every third-party action is pinned to a full commit SHA, with its version in a trailing comment.

name: weekly

on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      YELLO_REQUIRE_CONTAINER_RUNTIME: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Test code runs in this job; the token is not left in .git/config for it to read.
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore Yello.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build Yello.slnx -c Release --no-restore

      - name: Development certificate
        run: dotnet dev-certs https

      - name: Weekly - the envelope load and the cold path
        run: >-
          dotnet test --project tests/Yello.Tests.Slices/Yello.Tests.Slices.csproj -c Release --no-build
          --max-parallel-test-modules 1 --
          --filter-trait "Tier=Weekly" --explicit on
          --report-xunit-trx --results-directory "$GITHUB_WORKSPACE/TestResults/slices"

      - name: Test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weekly-results
          path: TestResults
          if-no-files-found: warn
